name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check src/main.js
          node --check src/app-controller.js
          node --check src/jupyter.js
          node --check scripts/prepare-runtime.js
      - name: Unit tests
        run: npm test

  jupyter-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Jupyter test dependencies
        run: python -m pip install -r runtime/requirements.txt
      - name: Locate test Python prefix
        run: echo "EULER_RUNTIME_ROOT=$(python -c 'import sys; print(sys.prefix)')" >> "$GITHUB_ENV"
      - name: Jupyter integration smoke test
        run: npm run test:jupyter
